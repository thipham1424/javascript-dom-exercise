<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Get Link Attributes</title>
  </head>
  <body>
    <p><a id="w3r" type="text/html" hreflang="en-us" rel="nofollow" target="_self" href="https://www.w3resource.com/">w3resource</a></p>
    <button type="button" id="btn">Click here to get  attributes value</button>
    <script>
      const btn = document.getElementById("btn");
      const link = document.getElementById("w3r");

      btn.addEventListener("click", () => {
        if (!link) return;
        alert(link.getAttribute("href"));
        alert(link.getAttribute("hreflang"));
        alert(link.getAttribute("rel"));
        alert(link.getAttribute("target"));
        alert(link.getAttribute("type"));
      });
    </script>
  </body>
</html>
