<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Remove Items From Dropdown</title>
  </head>

  <body>
    <form>
      <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>White</option>
        <option>Black</option>
      </select>

      <button type="button" id="removeBtn">Select and Remove</button>
    </form>

    <script>
      const removeButton = document.getElementById("removeBtn");
      const colorSelect = document.getElementById("colorSelect");

      removeButton.addEventListener("click", removeSelectedItem);

      function removeSelectedItem() {
        if (colorSelect.options.length === 0) {
          alert("The list is empty");
          return;
        }

        colorSelect.remove(colorSelect.selectedIndex);
      }
    </script>
  </body>
</html>
