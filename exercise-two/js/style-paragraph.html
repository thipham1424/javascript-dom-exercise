<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <title>JS DOM paragraph style</title>
  </head>
  <body>
    <p id="text">JavaScript Exercises - w3resource</p>
    <div>
      <button type="button" id="jsstyle" onclick="js_style()">Style</button>
    </div>

    <script>
      function js_style() {
        const p = document.getElementById("text");
        
        Object.assign(p.style, {
          color: "blue",
          fontSize: "3rem",
          fontFamily: "Brush Script MT",
        });
      }
    </script>
  </body>
</html>
